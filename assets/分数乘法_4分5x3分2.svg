<svg role="img" width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
  <title>分数乘法面积模型</title>
  <desc>长方形竖分5取4蓝，横分3取2橙，重叠8格深红为8/15</desc>
  <defs>
    <pattern id="d" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#791F1F" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <text x="340" y="36" text-anchor="middle" font-size="15px" fill="#2C2C2A" font-weight="500">分数乘法 · 面积模型：4/5 × 2/3 = 8/15</text>

  <g transform="translate(140, 64)">
    <rect x="-2" y="-2" width="404" height="172" rx="10" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>

    <rect x="320" y="0" width="80" height="56" rx="4" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
    <rect x="320" y="56" width="80" height="56" rx="4" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
    <rect x="320" y="112" width="80" height="56" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>

    <rect x="0" y="112" width="80" height="56" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <rect x="80" y="112" width="80" height="56" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <rect x="160" y="112" width="80" height="56" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <rect x="240" y="112" width="80" height="56" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>

    <rect x="0" y="0" width="80" height="56" rx="4" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
    <rect x="0" y="0" width="80" height="56" rx="4" fill="url(#d)"/>
    <text x="40" y="32" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#A32D2D" font-weight="500">1/15</text>

    <rect x="80" y="0" width="80" height="56" rx="4" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
    <rect x="80" y="0" width="80" height="56" rx="4" fill="url(#d)"/>
    <text x="120" y="32" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#A32D2D" font-weight="500">1/15</text>

    <rect x="160" y="0" width="80" height="56" rx="4" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
    <rect x="160" y="0" width="80" height="56" rx="4" fill="url(#d)"/>
    <text x="200" y="32" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#A32D2D" font-weight="500">1/15</text>

    <rect x="240" y="0" width="80" height="56" rx="4" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
    <rect x="240" y="0" width="80" height="56" rx="4" fill="url(#d)"/>
    <text x="280" y="32" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#A32D2D" font-weight="500">1/15</text>

    <rect x="0" y="56" width="80" height="56" rx="4" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
    <rect x="0" y="56" width="80" height="56" rx="4" fill="url(#d)"/>
    <text x="40" y="88" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#A32D2D" font-weight="500">1/15</text>

    <rect x="80" y="56" width="80" height="56" rx="4" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
    <rect x="80" y="56" width="80" height="56" rx="4" fill="url(#d)"/>
    <text x="120" y="88" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#A32D2D" font-weight="500">1/15</text>

    <rect x="160" y="56" width="80" height="56" rx="4" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
    <rect x="160" y="56" width="80" height="56" rx="4" fill="url(#d)"/>
    <text x="200" y="88" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#A32D2D" font-weight="500">1/15</text>

    <rect x="240" y="56" width="80" height="56" rx="4" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
    <rect x="240" y="56" width="80" height="56" rx="4" fill="url(#d)"/>
    <text x="280" y="88" text-anchor="middle" dominant-baseline="central" font-size="12px" fill="#A32D2D" font-weight="500">1/15</text>

    <text x="40" y="178" text-anchor="middle" font-size="11px" fill="#0C447C">1/5</text>
    <text x="120" y="178" text-anchor="middle" font-size="11px" fill="#0C447C">1/5</text>
    <text x="200" y="178" text-anchor="middle" font-size="11px" fill="#0C447C">1/5</text>
    <text x="280" y="178" text-anchor="middle" font-size="11px" fill="#0C447C">1/5</text>
    <text x="360" y="178" text-anchor="middle" font-size="11px" fill="#B4B2A9">1/5</text>

    <text x="-8" y="32" text-anchor="end" dominant-baseline="central" font-size="11px" fill="#854F0B">1/3</text>
    <text x="-8" y="88" text-anchor="end" dominant-baseline="central" font-size="11px" fill="#854F0B">1/3</text>
    <text x="-8" y="144" text-anchor="end" dominant-baseline="central" font-size="11px" fill="#B4B2A9">1/3</text>

    <line x1="0" y1="-16" x2="320" y2="-16" stroke="#185FA5" stroke-width="1.5"/>
    <line x1="0" y1="-20" x2="0" y2="-12" stroke="#185FA5" stroke-width="1"/>
    <line x1="320" y1="-20" x2="320" y2="-12" stroke="#185FA5" stroke-width="1"/>
    <text x="160" y="-24" text-anchor="middle" font-size="13px" fill="#0C447C" font-weight="500">4/5</text>

    <line x1="412" y1="0" x2="412" y2="112" stroke="#BA7517" stroke-width="1.5"/>
    <line x1="416" y1="0" x2="408" y2="0" stroke="#BA7517" stroke-width="1"/>
    <line x1="416" y1="112" x2="408" y2="112" stroke="#BA7517" stroke-width="1"/>
    <text x="426" y="60" text-anchor="start" font-size="13px" fill="#854F0B" font-weight="500">2/3</text>
  </g>

  <g transform="translate(140, 270)">
    <rect x="0" y="0" width="400" height="80" rx="10" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
    <text x="200" y="28" text-anchor="middle" font-size="14px" fill="#2C2C2A" font-weight="500">4/5 × 2/3 = (4 × 2) / (5 × 3)</text>
    <text x="200" y="56" text-anchor="middle" font-size="14px" fill="#A32D2D" font-weight="500">= 8/15</text>
    <text x="200" y="74" text-anchor="middle" font-size="11px" fill="#888780">重叠部分：4 列 × 2 行 = 8 小格，每格 1/5 × 1/3 = 1/15</text>
  </g>

  <g transform="translate(140, 370)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
    <text x="18" y="10" font-size="11px" fill="#5F5E5A">4/5（蓝色）</text>
    <rect x="100" y="0" width="12" height="12" rx="3" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
    <text x="118" y="10" font-size="11px" fill="#5F5E5A">2/3（橙色）</text>
    <rect x="200" y="0" width="12" height="12" rx="3" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
    <text x="218" y="10" font-size="11px" fill="#5F5E5A">重叠 8/15（深红斜线）</text>
  </g>

  <text x="340" y="420" text-anchor="middle" font-size="11px" fill="#B4B2A9">✨ Codex + DeepSeek 生成 | 薛国权 · 运城市人民路学校</text>
</svg>
